schema_version: 1
tasks:
  # ci.yml: check_generated_parser
  # NOTE: runs in quay.io/prometheus/golang-builder:1.27-base as in CI: cinema runs the steps inside it, as root, and fingerprints the image digest
  # NOTE: inlined composite action prometheus/promci-setup@55bd31fe92710532260eb57c554f2697363285c5
  # NOTE: $GITHUB_ENV, $GITHUB_PATH and $GITHUB_OUTPUT are emulated with temp files, loaded before each step
  check-generated-parser:
    argv:
      - bash
      - -eo
      - pipefail
      - -c
      - |-
        export GITHUB_ENV=$(mktemp) GITHUB_PATH=$(mktemp) GITHUB_OUTPUT=$(mktemp) GITHUB_STEP_SUMMARY=/dev/null
        trap 'rm -f "$GITHUB_ENV" "$GITHUB_PATH" "$GITHUB_OUTPUT"' EXIT
        _gh_load() {
          local l n d v x p
          while IFS= read -r l; do
            n=${l%%=*}
            if [[ $n == *'<<'* ]]; then
              n=${l%%<<*} d=${l#*<<} v=
              while IFS= read -r x && [[ $x != "$d" ]]; do v+=${v:+$'\n'}$x; done
              export "$n=$v"
            elif [[ $l == *=* ]]; then
              export "$n=${l#*=}"
            fi
          done <"$GITHUB_ENV"
          while IFS= read -r p; do [[ -n $p ]] && PATH=$p:$PATH; done <"$GITHUB_PATH"
        }
        (
          _gh_load
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        )
        (
          _gh_load
        ratio=0.8
        cgroup=$(awk -F':' '{print $3}' /proc/self/cgroup)
        cgroup_mem_limit=$(< "/sys/fs/cgroup/${cgroup}/memory.max")
        if [[ "${cgroup_mem_limit}" != "max" ]] ; then
          echo "${cgroup_mem_limit}" | awk -v "ratio=${ratio}" '{printf "GOMEMLIMIT=%.0fKiB\n", $1 / 1024 * ratio}' >> "$GITHUB_ENV"
          exit 0
        fi
        awk -v "ratio=${ratio}" '$1 == "MemTotal:" {printf "GOMEMLIMIT=%.0fKiB\n", $2 * ratio}' /proc/meminfo >> "$GITHUB_ENV"
        )
        (
          _gh_load
        echo "GOMEMLIMIT=${GOMEMLIMIT}"
        )
        (
          _gh_load
        make promu
        )
        (
          _gh_load
        make install-goyacc check-generated-parser
        )
        (
          _gh_load
        make check-generated-promql-functions
        )
    platform: linux/amd64
    container: quay.io/prometheus/golang-builder:1.27-base
    cpus: 4
    timeout: 60m
    reuse:
      allowed: true
      max_age: 24h
